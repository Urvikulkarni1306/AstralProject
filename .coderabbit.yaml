# CodeRabbit configuration for Astral Project.
# Full reference: https://docs.coderabbit.ai/guides/configure-coderabbit
language: en-US

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    auto_incremental_review: true
  review_status: true
  collapse_walkthrough: false
  # Rust workspace: only these paths matter for review.
  path_filters:
    - "crates/**/*.rs"
    - "!crates/**/testdata/**"
  path_instructions:
    - path: "crates/astra-types/**"
      instructions: >
        This crate is the schema everything depends on. Flag any change that
        alters serialised formats, fixed-point semantics, or capture record
        fields without a schema-version bump.
    - path: "crates/astra-book/**"
      instructions: >
        Order-book correctness is the product. Challenge any change to level
        application, snapshot bootstrap, or gap semantics. A book that looks
        right but is wrong is the worst possible outcome here.
    - path: "crates/astra-record/src/feed.rs"
      instructions: >
        Venue stream names must come from citable venue documentation, never
        from memory. A plausible-but-wrong stream name passes string tests
        silently; demand a source for every new mapping.

chat:
  auto_reply: true
